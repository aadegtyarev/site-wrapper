name: Checks

on:
  push:
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format
        run: test -z "$(gofmt -l internal cmd)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test extension
        run: node --test extension/*.test.mjs
      - name: Lint Firefox extension
        run: npm exec --yes --package=web-ext@10.8.0 -- web-ext lint --source-dir extension --self-hosted --warnings-as-errors
  desktop-build:
    needs: [go, extension]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: linux
            goos: linux
            output: sitewrap
          - target: windows
            goos: windows
            output: sitewrap.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build executable
        env:
          GOOS: ${{ matrix.goos }}
          CGO_ENABLED: '0'
        run: go build -ldflags "-X main.version=${GITHUB_SHA::7}" -o "dist/${{ matrix.output }}" ./cmd/sitewrap
      - name: Package unsigned extension
        run: python3 scripts/package-extension.py dist/sitewrap@aadegtyarev.github.io.xpi
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}-unsigned
          path: dist/
  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-37' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'
      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug
          path: android/app/build/outputs/apk/debug/*.apk
